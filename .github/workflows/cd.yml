name: CD

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'dev'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build dev APK
        run: >-
          flutter build apk --release
          --target lib/main_dev.dart
          --dart-define-from-file=env/dev.json

      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-calculator-dev-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod'
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build prod APK
        run: >-
          flutter build apk --release
          --target lib/main_prod.dart
          --dart-define-from-file=env/prod.json

      - name: Upload prod artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-calculator-prod-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: errorname: CD — Build & Release

# ─── When does this run? ────────────────────────────────────────────────────
# • Push to 'develop'  → builds a DEBUG APK (quick test build)
# • Push to 'main'     → builds a RELEASE APK ready for distribution
# • Push a tag v*.*.*  → same as main, used for versioned releases
# ────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*.*.*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════
  # JOB 1 — Build Android APK
  # Runs on: GitHub's free Linux server (ubuntu)
  # ══════════════════════════════════════════════
  build_android:
    name: "Android Build (${{ github.ref_name }})"
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Java (required by Android build tools)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # 3. Install Flutter SDK
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true         # cache saves ~2 min on subsequent runs

      # 4. Download all Dart/Flutter packages
      - name: Install dependencies
        run: flutter pub get

      # 5a. Build DEBUG APK when pushing to 'develop'
      - name: Build Debug APK
        if: github.ref == 'refs/heads/develop'
        run: flutter build apk --debug

      # 5b. Build RELEASE APK when pushing to 'main' or a version tag
      - name: Build Release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: flutter build apk --release

      # 6. Save the APK as a downloadable artifact (visible on the Actions page)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-calculator-apk-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: ignore
          retention-days: 14    # artifact available for 14 days

  # ══════════════════════════════════════════════
  # JOB 2 — Create GitHub Release (tags only)
  # Runs on: push of a version tag like v1.0.0
  # ══════════════════════════════════════════════
  create_release:
    name: "Create GitHub Release"
    runs-on: ubuntu-latest
    needs: build_android               # wait for the build to finish first
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write                  # needed to create a release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download the APK built in the previous job
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-calculator-apk-${{ github.ref_name }}
          path: release-assets/

      # Create a GitHub Release with the APK attached
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Calculator ${{ github.ref_name }}"
          body: |
            ## Flutter Calculator ${{ github.ref_name }}

            ### What's new
            - See commits since last release

            ### Downloads
            - **Android APK** — install directly on any Android device
          files: release-assets/**/*.apk
          draft: false
          prerelease: false
